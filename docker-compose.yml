services:
  api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    image: teamspeak-backend-api:local
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 10000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    ports:
      - "10000:10000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:10000/health').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5

  realtime:
    build:
      context: ./backend-realtime
      dockerfile: Dockerfile
    image: teamspeak-backend-realtime:local
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 10000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    ports:
      - "10001:10000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:10000/health').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:10000}
        VITE_REALTIME_URL: ${VITE_REALTIME_URL:-http://localhost:10001}
    image: teamspeak-frontend:local
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
