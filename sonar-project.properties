# La clave, organización, host y token se inyectan desde GitHub Actions.
sonar.projectName=TeamSpeak Backend
sonar.sources=backend-api,backend-realtime
sonar.tests=backend-api,backend-realtime
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/__tests__/**,.scannerwork/**
sonar.coverage.exclusions=**/src/services/firestore.documents.ts
sonar.typescript.tsconfigPaths=backend-api/tsconfig.json,backend-realtime/tsconfig.json
sonar.javascript.lcov.reportPaths=backend-api/coverage/lcov.info,backend-realtime/coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.newCode.referenceBranch=main
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
