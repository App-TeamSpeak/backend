name: Keep Render services awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Ping production services
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check API health
        run: curl --fail --silent --show-error --max-time 20 https://teamspeak-backend-api.onrender.com/health
      - name: Check realtime health
        run: curl --fail --silent --show-error --max-time 20 https://teamspeak-backend-realtime.onrender.com/health
